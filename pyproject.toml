[project]
name = "referral-finder"
version = "0.1.0"
description = "Find Cornell alumni at a company and request referrals"
requires-python = ">=3.10"
dependencies = [
    "linkedin-scraper @ git+https://github.com/joeyism/linkedin_scraper.git",
    "typer",
    "rich",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "google-api-python-client",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
refer = "referral.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["referral"]
