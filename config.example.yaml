# Copy this file to config.yaml and fill in the "me" section.
# config.yaml is gitignored, so your details stay on your machine.

# Your profile: fills template.md and is used to rank candidates.
me:
  name: Alex Doe
  application_email: alex.doe@example.com  # the address you apply to jobs with; referral forms ask for it
  school: Cornell University      # as written on LinkedIn
  class_year: 2028
  major: Computer Science
  resume_path: resume.pdf         # relative to the project folder; gitignored
  # Your school's LinkedIn ID (used as the people-search "schoolFilter"). To find it,
  # open your school's LinkedIn page and click "Alumni"; the URL contains
  # schoolFilter=["<ID>"]. Cornell University is 3523.
  linkedin_school_id: "3523"

# Roles you want referrals for; used to rank alumni by relevance. The first one is
# also the default people-search keyword.
target_roles:
  - software engineer

# LinkedIn limits. Keep them low: heavy scraping gets accounts restricted.
linkedin:
  session_path: session.json
  max_profiles_per_run: 15
  max_profiles_per_day: 40
  delay_seconds: [5, 15]  # random pause between profile checks
  headless: true          # false shows the browser while it works
  search_pages: 2         # result pages per search (10 people each)
  profiles_to_verify: 8   # top-ranked profiles to check for school + grad year

# Hunter.io email lookups. Usage is checked against your Hunter account before every
# paid call, and the tool never goes past this many credits per month (finder = 1
# credit, only when it finds an email).
hunter:
  monthly_credit_limit: 50  # free plan
  # Guess addresses from the company's email format and check them with Hunter's
  # verifier (0.5 credit per guess, up to 3 per person). Finds some emails at companies
  # with a uniform format, but uses credits fast.
  guess_emails: false

# Apollo.io, tried when Hunter finds nothing (needs APOLLO_API_KEY in .env; remove
# the key to turn it off). Apollo bills 1 credit per matched person. Its API can't
# report your balance, so set these from apollo.io → Settings → Billing and credits.
apollo:
  monthly_credit_limit: 75  # free plan allowance at the time of writing
  reset_day: 1              # day of the month your Apollo credits renew

# Claude models. compose = writes each email; extract = structures scraped text.
models:
  compose: claude-sonnet-5-5
  extract: claude-haiku-5-5

# The "Jobs to apply to" column: open internships from SimplifyJobs' GitHub list
# (refreshed at most hourly). Jobs you've already searched or queued are hidden.
simplify:
  listings_url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
  terms: ["Summer 2027"]
  # Simplify's categories: Software, AI/ML/Data, Hardware, Product, Quant
  categories: ["Software", "Software Engineering", "AI/ML/Data", "Data Science, AI & Machine Learning"]
  us_only: true      # hide jobs with no location in the United States
  exclude_phd: true  # hide jobs only open to PhD students (PhD is the only degree listed, or "PhD" in the title)
  max_age_days: 10   # hide jobs posted more than this many days ago

# Jobs from Instagram stories, added to "Jobs to apply to" (needs `refer ig-login`
# with a spare account; see README). Checked once a day while `refer web` is open,
# or by `refer ig-fetch` from a scheduler.
instagram:
  accounts: [zero2sudo]
  session_path: ig_session.json  # gitignored
  check_every_hours: 24

# When emails go out. "Send" / "Schedule all" queue them for the next send_time; the
# site sends them then (Gmail's API has no scheduled send), 20–60 s apart. If the
# site wasn't running at that time, they go out when it starts, up to 3 hours late;
# after that they move to the next day. "Send now" skips the wait.
email:
  send_time: "11:00"
  timezone: America/New_York
